# Retired cloud snapshot entry point.
#
# GitHub-hosted runners have been unable to connect to the MPC since 2026-08-04. The
# daily archive now runs only from the local, pinned operations checkout documented in
# `itf-linker/docs/archive-operations.md`. Keeping the old network/write implementation
# dispatchable would create a second publisher and could race the authoritative archive.
#
# This manual-only workflow is intentionally informational: it has read-only permissions,
# checks out no code, contacts no service, creates no release, and pushes no commit.

name: ITF snapshot (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the active archive path
        run: |
          echo "::notice title=ITF cloud snapshot retired::The authoritative daily archive runs from the local pinned operations checkout. See itf-linker/docs/archive-operations.md."
