name: CI

on:
  push:
    branches: [main, advance-portfolio]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.project }} · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [adql-copilot, seti-ellipsoid-broker]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Network-dependent smoke tests are opt-in via env flag and stay skipped here,
      # so CI is hermetic and does not depend on external archive availability.
      - name: Test
        working-directory: ${{ matrix.project }}
        run: pytest -q

  node:
    name: pta-explainer · node20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pta-explainer/package-lock.json

      - name: Install
        working-directory: pta-explainer
        run: npm ci

      - name: Test
        working-directory: pta-explainer
        run: npm test

      - name: Typecheck and build
        working-directory: pta-explainer
        run: npm run build
