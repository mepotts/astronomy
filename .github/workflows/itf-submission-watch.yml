# Daily, public-safe watch on the ITF review queue. It reports; it never submits.
#
# The local scheduled task is the only process that contacts the MPC for the ITF. This
# workflow downloads the newest slim key set from this repository's `itf-state` release
# and recomputes queue status from committed inputs.
#
# PRIVACY BOUNDARY. Public output is counts and freshness status only. The workflow does
# not build, print, upload, or embed candidate identifiers or submission JSON. A review
# payload can only be built locally with `scripts/m13_submit_payload.py` and remains behind
# the per-batch human gate.
#
# STATE BOUNDARY. Candidate changes and snapshot freshness are separate signals. Runtime
# state is restored/saved through an Actions cache on every successful observation. It is
# never committed or pushed to `main`, so this job cannot race the local snapshot publisher.
# State contains candidate fingerprints, not exact row identifiers.
#
# Both triggers require this file on the repository's default branch. A scheduled workflow
# does nothing while it exists only on a feature branch.

name: ITF submission watch

on:
  schedule:
    # 15:00 UTC, a couple of hours after the local task's usual ~12:26 UTC pull.
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: itf-submission-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: itf-linker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: itf-linker/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Restore private watch state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/itf-submission-watch-state.json
          key: itf-submission-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            itf-submission-watch-

      # A missing asset is not a candidate result. It means there is no published key set
      # to measure, so archive health fails red without fabricating a queue state.
      - name: Fetch the newest published key set
        id: keyset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/keyset
          name=$(gh release view itf-state --json assets \
            -q '.assets[].name | select(startswith("observations-"))' | sort | tail -1)
          if [ -z "$name" ]; then
            echo "::error::no published key set; archive health cannot be measured"
            exit 1
          fi
          gh release download itf-state --pattern "$name" --dir data/keyset --clobber
          sid="${name#observations-}"
          sid="${sid%.parquet}"
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "sid=$sid" >> "$GITHUB_OUTPUT"
          echo "path=data/keyset/$name" >> "$GITHUB_OUTPUT"
          echo "using snapshot $sid"

      - name: Check candidate counts and snapshot freshness
        id: watch
        if: steps.keyset.outputs.found == '1'
        run: |
          if [ ! -f data/raw/ObsCodes.html ]; then
            echo "::error::committed observatory table missing; refusing an implicit MPC fetch"
            exit 1
          fi
          python scripts/m13_submission_watch.py \
            --queue out/review-queue-v2-20260823.csv \
            --itf "${{ steps.keyset.outputs.path }}" \
            --snapshot-id "${{ steps.keyset.outputs.sid }}" \
            --state "${{ runner.temp }}/itf-submission-watch-state.json" \
            --neo-status out/queue-neo-status.json \
            --out-report out/submission-watch-report.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish counts-only job summary
        if: always() && steps.watch.outcome == 'success'
        run: cat out/submission-watch-report.md >> "$GITHUB_STEP_SUMMARY"

      # Candidate movement and freshness are separate workflow annotations. These are
      # counts/status only and perform no issue, comment, email, or other outward post.
      - name: Annotate candidate-count change
        if: >-
          always() && steps.watch.outcome == 'success' &&
          steps.watch.outputs.candidate_changed == 'true'
        env:
          SNAPSHOT: ${{ steps.watch.outputs.snapshot }}
          READY: ${{ steps.watch.outputs.ready }}
          HELD: ${{ steps.watch.outputs.held }}
          NEW_READY: ${{ steps.watch.outputs.new_ready }}
          NO_LONGER_READY: ${{ steps.watch.outputs.no_longer_ready }}
        run: |
          echo "::notice title=ITF candidate counts changed::Snapshot $SNAPSHOT: $READY ready, $HELD held; $NEW_READY newly ready, $NO_LONGER_READY no longer ready. No identifiers or payload published."

      - name: Annotate snapshot-freshness warning
        if: >-
          always() && steps.watch.outcome == 'success' &&
          steps.watch.outputs.freshness_alert == 'true'
        env:
          SNAPSHOT: ${{ steps.watch.outputs.snapshot }}
          STATUS: ${{ steps.watch.outputs.snapshot_status }}
        run: |
          echo "::warning title=ITF snapshot stale::Snapshot $SNAPSHOT is $STATUS and failed the freshness check. This is archive health, not a candidate result."

      # Unique keys make every successful observation durable; restore-keys selects the
      # newest prior state on the next run. This happens even when candidate counts did not
      # change, so snapshot history is never conditional on a notification.
      - name: Persist private watch state
        if: always() && steps.watch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/itf-submission-watch-state.json
          key: itf-submission-watch-${{ github.run_id }}-${{ github.run_attempt }}

      # A stale archive is a failed daily health check. This runs after cache persistence,
      # so the observation is retained while the red workflow status supplies the alert.
      - name: Fail stale snapshot health check
        if: >-
          always() && steps.watch.outcome == 'success' &&
          steps.watch.outputs.freshness_alert == 'true'
        run: |
          echo "::error::newest ITF key set failed the 24-hour freshness check"
          exit 1
