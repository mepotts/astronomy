[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itf-linker"
version = "0.1.0"
description = "Mine the MPC's Isolated Tracklet File (~9.4M unlinked observations) for linkable minor-planet tracklets: parse, index, link, fit, vet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Potts", email = "matthew.e.potts@gmail.com" }]
keywords = ["astronomy", "minor-planets", "asteroids", "MPC", "ITF", "astrometry", "linking"]

# M0 (kill-check) needs only the ingest/index half of this list: polars+pyarrow for the
# columnar store, typer for the CLI, requests for the fetch, astropy(+healpix) for time and
# sky partitioning. The rest of the milestones (Find_Orb wrapper, ADES emit) add no new
# Python deps -- Find_Orb is a subprocess. Versions are floors, not pins.
dependencies = [
    "typer>=0.12",
    "polars>=1.0",            # columnar engine over the parsed ITF (~9.4M rows)
    "pyarrow>=15",            # Parquet read/write backing polars
    "requests>=2.31",         # ITF + MPEC fetches
    "astropy>=6.0",           # Time (UTC->MJD/JD), SkyCoord
    "astropy-healpix>=1.0",   # HEALPix pixelisation for spatial partitioning
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
itf-linker = "itf_linker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/itf_linker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the full ~9.4M-row ITF snapshot in data/raw (run after `itf-linker fetch`)",
    "network: performs a live HTTP request to the MPC",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# B008: typer's whole API is `x: T = typer.Option(...)` in the signature.
# BLE001: the observatory-longitude fetch is optional; any failure degrades to UTC nights
#         with a warning on stderr rather than taking the command down.
"src/itf_linker/cli.py" = ["B008", "BLE001"]
